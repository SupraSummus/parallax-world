# The Rust crates, built and checked together with one lock and one target.
# lab/ is a member, for the lock, but no default one: cargo test leaves its
# tests out, and pnpm lint checks it (--workspace); web/bindgen/ and local/
# likewise (local/'s tests are slow: docs/mechanics.md, "By local rules").
[workspace]
resolver = "3"
members = ["lattice", "bake", "worldgen", "ground", "light", "worlds", "worlds/cheese", "native", "web/bindgen", "lab", "statics", "mechanics", "local"]
default-members = ["lattice", "bake", "worldgen", "ground", "light", "worlds", "worlds/cheese", "statics", "mechanics", "native"]

# Debug builds keep files and lines, for panics and profiles, but no
# variables: about half the size on disk.
[profile.dev]
debug = "line-tables-only"

# The tests bake whole cells and generate whole tiles, several times faster
# optimised. Debug assertions stay on.
[profile.test]
opt-level = 2

# The native frontend's WebAssembly (pnpm wasm): optimised, built again in
# seconds after a change. pnpm build adds LTO (--config): a tenth smaller,
# though slower to build, and the tests run no faster.
[profile.wasm]
inherits = "release"
incremental = true
panic = "abort"

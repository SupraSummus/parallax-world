name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request's branch cancels its older run;
# pushes to main each get a group of their own, so every commit is checked.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# pnpm check and pnpm test:worlds in jobs side by side, a runner each: the tests are bound by the CPU,
# the worlds' contract most of all, so it has jobs of its own, the valley's one alone.
# Jobs that test the native frontend cache its dependencies' builds (wgpu, egui),
# saved from main only, so pull requests share one cache and don't evict it.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Cache Rust's dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The native frontend for browsers: what clippy, on the host, does not see.
      - name: Build
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Cache Rust's dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: pnpm test

      # pnpm hands what follows `--` to test:worlds' command.
      - name: Test the worlds' directions and places
        run: pnpm test:worlds -- --skip 'keeps_the_contract::'

  # The worlds' contract, but the valley's: a test each, run side by side.
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only Cargo, which the runner has.
      - name: Test the worlds' contract, but the valley's
        run: cargo test --release -p worlds --test contract -- --skip keeps_the_contract::valley

  valley-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only Cargo, which the runner has.
      - name: Test the valley's contract
        run: cargo test --release -p worlds --test contract keeps_the_contract::valley

  # The native frontend's GPU half, which the other jobs do not run,
  # on Mesa's software Vulkan: its tests that draw, and a view drawn.
  native-gpu:
    runs-on: ubuntu-latest
    # llvmpipe compiles shaders for the runner's CPU, and LLVM 21's AVX-512 code
    # draws the voxels engine wrong (docs/todo.md): none, on every runner.
    env:
      GALLIUM_OVERRIDE_CPU_CAPS: avx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Rust's dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools

      # Which CPU and llvmpipe the job got, to tell failures that follow the hardware.
      - name: Describe the runner
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Flags)'
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|driverInfo|apiVersion' || true

      - name: Test what draws
        run: cargo test --release --no-fail-fast -p parallax-native -- --ignored

      - name: Draw a view
        run: cargo run --release -p parallax-native -- --headless --world moor --seed 1 --look 30,-10 --size 320x200 --shot shot.png

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request's branch cancels its older run;
# pushes to main each get a group of their own, so every commit is checked.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# pnpm check in jobs side by side, a runner each: the tests are bound by the CPU,
# and the valley's contract alone takes as long as the rest of the Rust tests.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unused code (knip)
        run: pnpm knip

      - name: Test-only code (knip --production)
        run: pnpm knip:production

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm test:web

      - name: Build
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      # pnpm hands what follows `--` to test:rust's last command, worlds' cargo test.
      - name: Test, but the valley's contract
        run: pnpm test:rust -- --skip keeps_the_contract::valley

  valley-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only Cargo, which the runner has.
      - name: Test the valley's contract
        run: cargo test --release --manifest-path worlds/Cargo.toml --test contract keeps_the_contract::valley

      # lab/ is no part of pnpm check, but on worldgen's and worlds' API:
      # built here, so a change to them that breaks it shows.
      - name: Build the lab
        run: cargo build --release --all-targets --manifest-path lab/Cargo.toml

  # The native frontend's GPU half, which the other jobs do not run,
  # on Mesa's software Vulkan: its tests that draw, and a view drawn.
  native-gpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Test what draws
        run: cargo test --release --config native/.cargo/config.toml --manifest-path native/Cargo.toml -- --ignored

      - name: Draw a view
        run: cargo run --release --config native/.cargo/config.toml --manifest-path native/Cargo.toml -- --view 'seed=1&world=moor&look=30,-10' --size 320x200 --shot shot.png

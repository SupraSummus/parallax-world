name: Set up environment
description: Install pnpm, set up Node.js with pnpm cache, install dependencies, and add the nightly Rust that builds the WebAssembly

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The nightly pnpm wasm names, with std's source to build anew (its threads).
    - name: Add Rust's nightly for WebAssembly
      shell: bash
      run: |
        rustup toolchain install "$(grep -o 'nightly-[0-9-]*' package.json)" --profile minimal --component rust-src --target wasm32-unknown-unknown
        rustup component add clippy rustfmt

[package]
name = "worlds"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worldgen = { path = "../worldgen" }

[profile.test]
opt-level = 2

# The web's WebAssembly (pnpm wasm): small and fast, however long it takes to build.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"

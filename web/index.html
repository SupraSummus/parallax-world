<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #ccc; font: 14px sans-serif; }
        /* The native frontend's window (native/src/window.rs): the page sizes it. */
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        p { position: absolute; margin: 1em; }
    </style>
</head>

<body>
    <!-- The native frontend (native/), in WebAssembly (pnpm wasm, pnpm bindgen), with the page's view query. -->
    <script type="module">
        import init from './native/parallax-native.js'
        import wasm from './native/parallax-native_bg.wasm?url'
        const say = text => { document.body.appendChild(document.createElement('p')).textContent = text }
        // Its threads (native/src/threads.rs): a Web Worker each, on its module and the memory they share.
        globalThis.spawnThread = (module, memory, work) =>
            new Worker(new URL('./worker.js', import.meta.url), { type: 'module' }).postMessage([module, memory, work])
        // They share memory only in a page isolated: where the server does not, a service worker does, from the next load.
        if (!crossOriginIsolated) {
            if (!navigator.serviceWorker || navigator.serviceWorker.controller)
                say('Parallax shares memory between threads, which this browser does not allow this page.')
            else navigator.serviceWorker.register('./isolated.js')
                .then(() => navigator.serviceWorker.ready)
                .then(() => location.reload())
                .catch(e => { say(`Parallax stopped: ${e}`) })
        }
        // The adapter asked for here first: the native frontend panics without one.
        else if (!navigator.gpu) say('Parallax draws with WebGPU, which this browser does not have.')
        else navigator.gpu.requestAdapter()
            .then(adapter => adapter
                ? init({ module_or_path: wasm })
                : say('Parallax draws with WebGPU, which this browser has but gives no GPU to: it is off or blocked here.'))
            .catch(e => { say(`Parallax stopped: ${e}`) })
    </script>
</body>

</html>

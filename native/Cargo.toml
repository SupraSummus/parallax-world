[package]
name = "parallax-native"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bake = { path = "../bake" }
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
png = "0.18"
pollster = "1"
worldgen = { path = "../worldgen" }

[profile.release]
debug = 0

[package]
name = "parallax-native"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bake = { path = "../bake" }
bytemuck = { version = "1.25", features = ["derive"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
png = "0.18"
pollster = "1"
worldgen = { path = "../worldgen" }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "x11"] }
worlds = { path = "../worlds" }

[profile.release]
debug = 0

[package]
name = "parallax-native"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bake = { path = "../bake" }
bytemuck = { version = "1.25", features = ["derive"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
fcc = { path = "../fcc" }
light = { path = "../light" }
worldgen = { path = "../worldgen" }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "x11"] }
worlds = { path = "../worlds" }
pollster = "1"
web-time = "1"
clap = { version = "4.6.9", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

# In a browser (pnpm wasm): the page's canvas and query, and futures on its loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# As web/bindgen/ binds.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Navigator", "Window", "console"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
wgpu-naga-bridge = "30"
